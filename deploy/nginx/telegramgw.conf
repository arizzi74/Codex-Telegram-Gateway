# Include this file from the http block for the map and from the HTTPS server
# configuration for the server. Replace the example hostname and certificate
# paths with your deployment settings; do not expose the loopback gateway directly.
map $http_upgrade $telegramgw_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=telegramgw_login_begin:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=telegramgw_login_finish:1m rate=20r/m;

server {
    listen 443 ssl http2;
    server_name gateway.example.com;
    ssl_certificate /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    client_max_body_size 1m;

    location = /tghealthz { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location = /tgreadyz  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    # Both login phases have per-client limits in addition to gateway limits.
    # Overwrite X-Real-IP; the loopback gateway uses only this trusted value.
    location = /tgapi/v1/admin/login/begin {
        limit_req zone=telegramgw_login_begin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /tgapi/v1/admin/login/finish {
        limit_req zone=telegramgw_login_finish burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /tgadmin { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /tgadmin/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /tgapi/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $telegramgw_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location / { return 404; }
}
