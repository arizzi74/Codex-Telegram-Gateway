name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: VERSION=${{ github.sha }} ./scripts/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
