name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-whisper:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/native-whisper.yml
    with:
      version: ${{ github.sha }}

  native-speech:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/native-speech.yml
    with:
      version: ${{ github.sha }}

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  test:
    needs: [native-whisper, native-speech]
    if: always() && ((needs.native-whisper.result == 'success' && needs.native-speech.result == 'success') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check new vulnerability advisories
        if: github.event_name == 'schedule'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'schedule'
        with:
          pattern: whisper-*
          merge-multiple: true
          path: .native-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'schedule'
        with:
          pattern: speech-*
          merge-multiple: true
          path: .speech-dist
      - run: VERSION=${{ github.sha }} ./scripts/ci.sh
        if: github.event_name != 'schedule'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'schedule'
        with:
          name: release-artifacts
          path: dist/
